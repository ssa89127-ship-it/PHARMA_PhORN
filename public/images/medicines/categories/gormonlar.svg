<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B2DFDB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00695C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004D40;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)" rx="12"/>
  
  <!-- Medicine Box -->
  <g filter="url(#shadow)">
    <rect x="50" y="30" width="100" height="130" rx="8" fill="url(#box)"/>
    <rect x="50" y="30" width="100" height="35" rx="8" fill="#00695C" opacity="0.9"/>
    <rect x="50" y="55" width="100" height="10" fill="#00695C"/>
    <rect x="50" y="30" width="8" height="130" rx="4" fill="white" opacity="0.2"/>
  </g>
  
  <!-- Cross symbol -->
  <g transform="translate(100, 50)">
    <rect x="-15" y="-3" width="30" height="6" rx="3" fill="white" opacity="0.9"/>
    <rect x="-3" y="-15" width="6" height="30" rx="3" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Category name -->
  <text x="100" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Gormonlar</text>
  
  <!-- Bottom label -->
  <rect x="55" y="135" width="90" height="18" rx="9" fill="white" opacity="0.95"/>
  <text x="100" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#00695C">PHARMA</text>
  
  <!-- Decorative dots -->
  <circle cx="70" cy="165" r="3" fill="#00695C" opacity="0.3"/>
  <circle cx="100" cy="165" r="3" fill="#00695C" opacity="0.3"/>
  <circle cx="130" cy="165" r="3" fill="#00695C" opacity="0.3"/>
</svg>